[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "modelharbor"
version = "0.1.0"
description = "A budgeted multi-provider LLM gateway with isolated caching"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx[socks]>=0.27,<1", "pydantic>=2.9,<3", "scikit-learn>=1.5"]
[project.optional-dependencies]
dev = ["pytest>=8,<10"]
[project.scripts]
modelharbor = "modelharbor.cli:main"
[tool.setuptools.packages.find]
include = ["modelharbor*"]
[tool.setuptools.package-data]
modelharbor = ["*.sql", "*.json"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
